<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="420" viewBox="0 0 1900 420" role="img" aria-labelledby="brand-title brand-desc">
<title id="brand-title">Robot Framework IDE</title>
<desc id="brand-desc">The project's existing teal robot icon followed by Robot Framework IDE, all on one horizontal line.</desc>
<rect x="0" y="0" width="1900" height="420" rx="38" fill="#16181D"/><g transform="translate(54 42) scale(.65625)">
  <defs>
   <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#242832"/>
    <stop offset=".55" stop-color="#191C23"/>
    <stop offset="1" stop-color="#11141A"/>
   </linearGradient>
   <radialGradient id="glow" cx="50%" cy="78%" r="58%">
    <stop offset="0" stop-color="#00B0A0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#00B0A0" stop-opacity="0"/>
   </radialGradient>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#surface)"/>
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#glow)"/>
  <rect x="13.5" y="13.5" width="485" height="485" rx="108.5" fill="none" stroke="#5A6C78" stroke-opacity=".34" stroke-width="3"/>

