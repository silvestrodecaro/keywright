  <path d="M213 302 L238 319 L213 336" fill="none" stroke="#00B0A0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M257 336 H303" fill="none" stroke="#00B0A0" stroke-width="13" stroke-linecap="round"/>
