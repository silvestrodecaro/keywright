  <circle cx="256" cy="110" r="19" fill="#DDFCF7"/>
  <circle cx="256" cy="110" r="10" fill="#00B0A0"/>
  <!-- outer side connectors -->
  <rect x="104" y="243" width="40" height="56" rx="14" fill="#00B0A0"/>
  <rect x="368" y="243" width="40" height="56" rx="14" fill="#00B0A0"/>
  <!-- faceted, modern robot housing -->
  <path d="M184 169 H328 C337 169 346 173 353 180 L373 201 C380 208 384 217 384 228 V329 C384 351 366 368 345 368 H167 C146 368 128 351 128 329 V228 C128 217 132 208 139 201 L159 180 C166 173 175 169 184 169 Z" fill="#242C34" stroke="#00B0A0" stroke-width="18" stroke-linejoin="round"/>
  <!-- panel's top shine -->
  <path d="M180 197 H332" stroke="#DDFCF7" stroke-opacity=".14" stroke-width="7" stroke-linecap="round"/>
  <!-- calm pixel eyes -->
  <rect x="177" y="237" width="58" height="36" rx="12" fill="#DDFCF7"/>
  <rect x="277" y="237" width="58" height="36" rx="12" fill="#DDFCF7"/>
