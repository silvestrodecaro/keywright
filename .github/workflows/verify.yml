name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    env:
      KEYWRIGHT_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe
    steps:
      - uses: actions/checkout@v4
      - name: Configure shared browser storage
        shell: pwsh
        run: |
          $browserCache = Join-Path $env:RUNNER_TEMP 'keywright-browsers'
          "PLAYWRIGHT_BROWSERS_PATH=$browserCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Audit app and development dependencies
        run: npm audit --audit-level=moderate
      - name: Install the Electron runtime
        run: npm exec -- install-electron
      - name: Verify the Electron runtime
        run: node node_modules/electron/cli.js --version
      - name: Create the project Python environment
        run: python -m venv .venv
      - name: Install the Python test baseline
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Install the recorder browser
        run: npm run install-browsers
      - name: Install the Browser library browser
        run: .\.venv\Scripts\python.exe -m Browser.entry init chromium
      - name: Verify Python test dependencies
        run: .\.venv\Scripts\python.exe -c "import robot, Browser, robocop"
      - run: npm test
      - name: Run the example Robot Framework tests
        run: .\.venv\Scripts\python.exe -m robot --outputdir examples/browser-walkthrough/results examples/browser-walkthrough/tests
      - name: Verify setup from a long path with spaces
        shell: pwsh
        run: |
          $setupRoot = Join-Path $env:RUNNER_TEMP 'OneDrive - Setup Verification\Desktop\Keywright source checkout with a long directory name'
          git clone --no-hardlinks . $setupRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            & "$setupRoot\setup.bat" --non-interactive --no-pause
            $setupExit = $LASTEXITCODE
          } finally {
            $logs = Join-Path $setupRoot 'out\setup'
            if (Test-Path -LiteralPath $logs) {
              New-Item -ItemType Directory -Force -Path 'out\setup-check' | Out-Null
              Copy-Item -LiteralPath $logs -Destination 'out\setup-check\logs' -Recurse -Force
            }
          }
          if ($setupExit -ne 0) { exit $setupExit }
          $setupPython = Join-Path $setupRoot 'examples\browser-walkthrough\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $setupPython -PathType Leaf)) {
            throw 'Setup did not create the example Python environment in the long checkout.'
          }
          "KEYWRIGHT_PYTHON=$setupPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the Keywright desktop UI tests
        run: npm run test:ui
      - name: Upload setup and desktop UI failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keywright-failure-node-${{ matrix.node }}
          path: |
            out/ui-tests/
            out/ui-report/
            out/setup-check/
          if-no-files-found: ignore
          retention-days: 7
